name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:2.10.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP project
        run: |
          composer validate --strict
          composer audit
          composer lint
          composer test
          composer check-version
          composer phpcs

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate and build assets
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm run build

      - name: Build production package
        run: composer package

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          build-dir: build/cart-relay
          categories: |
            plugin_repo
            security
            performance
            accessibility
            general
          strict: true

      - name: Upload production package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cart-relay-production
          path: |
            build/cart-relay.zip
            build/package-manifest.txt
          if-no-files-found: error
          retention-days: 14
